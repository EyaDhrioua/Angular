<h1>Conférences</h1>

<div class="cards-container">
  @for (conf of conferances; track conf.id) {
    <article class="card">
      <img src="https://images.unsplash.com/photo-1540575467063-178a50c2df87" alt="Conférence" />
      <div class="card-content">
        <h2>{{ conf.name }}</h2>
        <p>📅 {{ conf.date }}</p>
        <p>📍 {{ conf.place }}</p>
        <a class="details-link" [routerLink]="['/conferences', conf.id]">Voir les détails</a>
      </div>
    </article>
  }
</div>
